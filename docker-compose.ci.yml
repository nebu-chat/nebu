# CI overlay — replaces build: directives with pre-built images from the GitLab registry.
#
# Usage (DinD integration-test job):
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait --no-build
#
# Kaniko pushes the server image in the `build` stage before this runs.
# CI_REGISTRY_IMAGE and CI_COMMIT_SHA are set automatically by GitLab CI.
#
# go-removal-cleanup (full-elixir-stack): the gateway and media images were removed —
# the Elixir server now serves all public endpoints (Matrix, /_matrix/media, admin).

services:
  server:
    image: ${CI_REGISTRY_IMAGE}/server:${CI_COMMIT_SHA}
