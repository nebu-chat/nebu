# Nebu Helm Chart — development / local kind overrides.
# Use with: helm install nebu deploy/helm/nebu/ -f deploy/helm/nebu/values-dev.yaml
# Reduces resource limits suitable for a local kind cluster.

image:
  pullPolicy: IfNotPresent

# go-removal-cleanup (full-elixir-stack): only the server image remains — it serves Matrix,
# /_matrix/media, and the admin UI.
server:
  image:
    # Override with the actual dev build tag, e.g. --set server.image.tag=dev-abc123
    tag: "dev"
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

postgres:
  # Use a bundled PostgreSQL in local dev environments.
  external: false
