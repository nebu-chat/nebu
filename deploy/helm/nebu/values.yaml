# Nebu Helm Chart — default values.
# Override these in your values.yaml or via --set flags.

# go-removal-cleanup (full-elixir-stack): the Go gateway and Go media images were removed.
# The Elixir server image is now the SINGLE application container — it serves the Matrix
# CS API, /_matrix/media, and the admin UI on its Bandit HTTP listener (container port 4000).
image:
  # registry: GitLab Container Registry path where release images are pushed.
  # The release pipeline (git tag vN.N.N) pushes:
  #    <registry>/nebu-server:<version>
  # Set this to your fork's registry path when deploying from a custom fork.
  registry: registry.gitlab.com/philippb/open-chat
  pullPolicy: IfNotPresent

server:
  # image.tag: versioned tag produced by the release pipeline (e.g. "1.0.0" for Git tag v1.0.0).
  # Must be overridden via --set server.image.tag=<version> or a values file.
  # Leaving this empty prevents accidental deployment of an unversioned image.
  image:
    tag: ""
  replicaCount: 1
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "1Gi"

# Non-secret application configuration (rendered into ConfigMap)
config:
  oidcIssuer: ""
  serverName: ""

# server Service configuration. The server Service exposes the public Matrix port and the
# admin port (both backed by the same Bandit listener), plus internal http/gRPC ports.
service:
  type: ClusterIP
  port: 8008
  adminPort: 8080

ingress:
  # Set enabled: true and provide a hostname to expose Nebu via an Ingress resource.
  enabled: false
  className: "nginx"
  annotations: {}
  # hostname is the FQDN used for the Ingress rule and TLS certificate.
  hostname: ""
  tls:
    # secretName: name of the TLS Secret created out-of-band (e.g. cert-manager).
    # Leave empty to disable TLS on the Ingress.
    secretName: ""

# existingSecret references a pre-created Kubernetes Secret that holds sensitive
# NEBU_* environment variables (e.g. NEBU_DB_URL, NEBU_INTERNAL_SECRET).
# Operators must create this Secret before deploying — see NOTES.txt.
# If name is empty, no secretRef is mounted and server will fail to start.
existingSecret:
  name: ""

# autoscaling configures HorizontalPodAutoscaler resources.
# go-removal-cleanup (full-elixir-stack): targets server (the sole public-serving Deployment).
autoscaling:
  server:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

postgres:
  # Set external: true to use an external database (default: true).
  # Set to false in local/dev environments to include a bundled PostgreSQL.
  external: true
  host: ""
  port: 5432
  database: nebu
  # Name of a Kubernetes Secret with keys: username, password
  secretName: nebu-db-credentials
  # storage and storageClass configure the PVC when postgres.external is false.
  storage: "10Gi"
  storageClass: ""

oidc:
  # Name of a Kubernetes Secret with keys: client_id, client_secret
  secretName: nebu-oidc-credentials

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
