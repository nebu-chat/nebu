{{- /*
go-removal-cleanup (full-elixir-stack): the gateway HPA was removed. server is now the
sole public-serving Deployment, so autoscaling targets server.
*/ -}}
{{- if .Values.autoscaling.server.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "nebu.fullname" . }}-server
  labels:
    {{- include "nebu.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "nebu.fullname" . }}-server
  minReplicas: {{ .Values.autoscaling.server.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.server.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.server.targetCPUUtilizationPercentage }}
{{- end }}
