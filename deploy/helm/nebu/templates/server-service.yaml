apiVersion: v1
kind: Service
metadata:
  name: {{ include "nebu.fullname" . }}-server
  labels:
    {{- include "nebu.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  # go-removal-cleanup (full-elixir-stack): the Go gateway Service was removed. server now
  # serves the public Matrix CS API, /_matrix/media, and the admin UI on its single Bandit
  # HTTP listener (targetPort http = container port 4000). The service exposes the public
  # Matrix (8008) and admin (8080) ports plus the raw http port (4000) — all backed by the
  # same listener — and the internal gRPC port (9000).
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: matrix
    - port: {{ .Values.service.adminPort }}
      targetPort: http
      protocol: TCP
      name: admin
    - port: 4000
      targetPort: http
      protocol: TCP
      name: http
    - port: 9000
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "nebu.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
