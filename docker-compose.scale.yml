# docker-compose.scale.yml — Multi-node scale override
#
# go-removal-cleanup (full-elixir-stack): the Go gateway was removed. The Elixir
# server now serves all public endpoints, so scaling means scaling `server`, not a
# separate gateway tier.
#
# Story 13-6 AC5: Adds a second server node (server2) that joins the Horde cluster
#                 via libcluster Gossip strategy.
#
# Usage (2-node cluster):
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d
#
# Note: When running more than one server replica behind a single host port you must
# place an external load balancer (nginx, haproxy, or the ALB/Stackit ALB from
# ADR-014) in front of the server replicas. server2 below does not publish host ports
# to avoid "address already in use" conflicts with the base server service.
# For local k6 load testing, attach k6 to the nebu_default network and
# point BASE_URL at a specific container's internal address, or add a
# reverse-proxy sidecar. See k6/README.md for examples.

name: nebu

services:
  # ─── Server 1 (base service override) ──────────────────────────────────────
  # Override the base server service to enable distributed Erlang with a named node.
  server:
    environment:
      RELEASE_NODE: "nebu@server"
      RELEASE_DISTRIBUTION: "name"
      # server2 is defined below; server1 does not need to list peers — libcluster Gossip
      # discovers nodes dynamically via multicast within the Docker network.
      CLUSTER_STRATEGY: "gossip"

  # ─── Server 2 (second clustering node) ──────────────────────────────────────
  # Story 13-6 AC5: second server node that joins the Horde cluster via libcluster.
  server2:
    build:
      context: ./server
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        RELEASE_VERSION: ${RELEASE_VERSION:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
    secrets: [internal_secret]
    environment:
      NEBU_DB_URL: "postgresql://nebu_app:nebu_app_dev_pw@postgres:5432/nebu"
      DATABASE_URL: "ecto://nebu_app:nebu_app_dev_pw@postgres:5432/nebu"
      NEBU_INTERNAL_SECRET_FILE: "/run/secrets/internal_secret"
      NEBU_SERVER_NAME: "localhost"
      NEBU_PII_ENCRYPTION_KEY: "${NEBU_PII_ENCRYPTION_KEY:-6465766b65793030303030303030303030303030303030303030303030303030}"
      RELEASE_NODE: "nebu@server2"
      RELEASE_DISTRIBUTION: "name"
      # Connect to server1 via Epmd peer list; Gossip multicast also discovers dynamically.
      CLUSTER_NODES: "nebu@server"
      CLUSTER_STRATEGY: "gossip"
    # server2 does not publish host ports — only server1 (base service) is reachable
    # from the host. Front both with an external LB for true multi-replica serving.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
