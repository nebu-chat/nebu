####
# Navigation configuration for the Nebu website.
# Key = file/directory name (without extension), value = display settings.
# Order of entries = order in the sidebar menu.
#
# logo: path relative to the dokument/ root — rendered in the page header/nav.
# custom_css: path to a CSS file with brand color overrides.
#
# The `architecture/` directory is NOT committed — it is generated by the CI
# `pages` job, which copies docs/architecture/ → website/dokument/architecture/
# before running the EasyWebsite build (Story 16-3, NFR-16.2).
####
logo: assets/nebu-logo.svg
custom_css: custom.css

