# Local dev HTTPS front door: Element Web + Nebu on ONE origin (https://nebu.localtest.me:7443).
# Mirrors the reference deploy templates: /_matrix, /oauth2, /account, /admin and the
# /.well-known documents go to the server, everything else is Element Web.
map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

server {
    listen 443 ssl;
    http2 on;
    server_name nebu.localtest.me localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    location /_matrix/ { set $u http://server:4000; proxy_pass $u; }
    location /oauth2/  { set $u http://server:4000; proxy_pass $u; }
    # The server answers /admin with an empty `upgrade:` response header (router.ex, admin_csp), which is
    # invalid in HTTP/2 (Safari/curl abort the stream), so it is dropped here.
    location /admin/   {
        set $u http://server:4000;
        proxy_pass $u;
        proxy_hide_header Upgrade;
    }
    location = /account { set $u http://server:4000; proxy_pass $u; }
    location /account/  { set $u http://server:4000; proxy_pass $u; }
    location = /logout     { set $u http://server:4000; proxy_pass $u; }
    location = /logout/all { set $u http://server:4000; proxy_pass $u; }
    location = /.well-known/openid-configuration { set $u http://server:4000; proxy_pass $u; }
    location /.well-known/matrix/ { set $u http://server:4000; proxy_pass $u; }

    location / {
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        try_files $uri $uri/ /index.html;
    }
}
