syntax = "proto3";

package core;

option go_package = "github.com/nebu/nebu/internal/grpc/pb";

// CoreService: all gRPC operations between Go Gateway and Elixir Core.
// Go is always the client; Elixir is always the server.
service CoreService {
  // Matrix operations (unary request/response)
  rpc SendEvent(SendEventRequest)           returns (SendEventResponse);
  rpc RedactEvent(RedactEventRequest)       returns (RedactEventResponse);  // story state-writer-redaction
  rpc CreateRoom(CreateRoomRequest)         returns (CreateRoomResponse);
  rpc JoinRoom(JoinRoomRequest)             returns (JoinRoomResponse);
  rpc LeaveRoom(LeaveRoomRequest)           returns (LeaveRoomResponse);
  rpc GetMessages(GetMessagesRequest)       returns (GetMessagesResponse);
  rpc SetPresence(SetPresenceRequest)       returns (SetPresenceResponse);
  rpc SetTyping(SetTypingRequest)           returns (SetTypingResponse);
  rpc ValidateToken(ValidateTokenRequest)   returns (ValidateTokenResponse);
  rpc GetPendingEvents(GetPendingEventsRequest)   returns (GetPendingEventsResponse);

  // Event Bus — server-streaming, one stream per Go instance
  rpc EventBus(EventBusRequest)             returns (stream Event);

  // GetMetrics — Admin Dashboard live metrics (Epic 3 skeleton; full implementation Epic 4)
  rpc GetMetrics(GetMetricsRequest)         returns (GetMetricsResponse);

  // GetRoomState — unary: Go queries current room members + metadata
  rpc GetRoomState(GetRoomStateRequest)     returns (GetRoomStateResponse);

  // InviteUser — invite a user to a room
  rpc InviteUser(InviteUserRequest)         returns (InviteUserResponse);

  // SetPowerLevels — update room power levels (caller must have change_state power)
  rpc SetPowerLevels(SetPowerLevelsRequest) returns (SetPowerLevelsResponse);

  // SendReceipt — persists a read receipt for a user in a room
  rpc SendReceipt(SendReceiptRequest) returns (SendReceiptResponse);

  // GetInitialSync — returns full state snapshot for all of a user's joined rooms
  rpc GetInitialSync(GetInitialSyncRequest) returns (GetInitialSyncResponse);

  // GetSyncDelta — incremental sync with long-polling; returns events after since_token
  rpc GetSyncDelta(GetSyncDeltaRequest) returns (GetSyncDeltaResponse);

  // GetPresence — returns presence status for a user (always succeeds; unknown users = offline)
  rpc GetPresence(GetPresenceRequest) returns (GetPresenceResponse);

  // UpdateProfile — upserts displayname and/or avatar_url for a user
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  // WriteAuditLog — called by Go gateway for admin/compliance events that originate
  // in the Go layer (login, logout, bootstrap). Room events are logged directly by Elixir.
  rpc WriteAuditLog(WriteAuditLogRequest) returns (WriteAuditLogResponse);

  // DeleteUserKeys — DSGVO key deletion: atomically soft-deletes private keys for a user.
  // Story 5.7: instance_admin only. Returns keys_deleted_at (Unix ms) on success.
  // Elixir Core handles the Ecto.Multi + failure-invariant audit emission.
  rpc DeleteUserKeys(DeleteUserKeysRequest) returns (DeleteUserKeysResponse);

  // KickUser — room moderator action; power check enforced by GenServer
  rpc KickUser(KickUserRequest) returns (KickUserResponse);

  // BanUser — bans a user from a room; power check enforced by GenServer
  rpc BanUser(BanUserRequest) returns (BanUserResponse);

  // UnbanUser — removes a ban (sets membership: leave); power check enforced by GenServer
  rpc UnbanUser(UnbanUserRequest) returns (UnbanUserResponse);

  // ForgetRoom — marks a room as excluded from future /sync for the calling user
  rpc ForgetRoom(ForgetRoomRequest) returns (ForgetRoomResponse);

  // ListPublicRooms — returns paginated public rooms (join_rule=public) with live member counts.
  // Story 7-27: GET/POST /_matrix/client/v3/publicRooms.
  rpc ListPublicRooms(ListPublicRoomsRequest) returns (ListPublicRoomsResponse);

  // GetEventContext — returns the target event plus up to `limit` events before
  // and after it, a state snapshot, and pagination tokens compatible with GetMessages.
  // Story 7-28.
  rpc GetEventContext(GetEventContextRequest) returns (GetEventContextResponse);

  // InvalidateUserSessions — Story 6.5: revoke all sessions for a user (admin deactivation).
  // Calls SessionManager.destroy_session/1 for the target user.
  // Returns ok=true on success; gRPC error on DB failure.
  rpc InvalidateUserSessions(InvalidateUserSessionsRequest) returns (InvalidateUserSessionsResponse);

  // UpdateRoomSettings — Story 6.8: Admin API notifies Room GenServer of settings change.
  // max_members = 0 means "no limit". Go gateway sends this after updating rooms table.
  // Elixir Core updates in-memory GenServer state; no-op if GenServer not running (will load from DB on next start).
  rpc UpdateRoomSettings(UpdateRoomSettingsRequest) returns (UpdateRoomSettingsResponse);

  // ArchiveRoom — Story 6.9: Admin API terminates the Room GenServer for an archived room.
  // The Go gateway has already updated rooms.status='archived' in DB before calling this.
  // Core stops the GenServer via Horde.DynamicSupervisor.terminate_child/2.
  // Returns ok=true in all cases (even if GenServer was already stopped).
  rpc ArchiveRoom(ArchiveRoomRequest) returns (ArchiveRoomResponse);

  // UnarchiveRoom — Story 6.9: Admin API restarts the Room GenServer for an unarchived room.
  // The Go gateway has already updated rooms.status='active' in DB before calling this.
  // Core restarts the GenServer via RoomSupervisor.start_room/1.
  rpc UnarchiveRoom(UnarchiveRoomRequest) returns (UnarchiveRoomResponse);

  // InvalidateAllAdminSessions — Story 6.10: destroys all active admin UI sessions in ETS.
  // Called by Go gateway after OIDC config changes (oidc_issuer, oidc_client_id, oidc_client_secret).
  // Iterates EtsStore.list_user_ids/0 and calls SessionSupervisor.destroy_session/1 for each.
  // Returns ok=true always (best-effort — OIDC config is already updated in DB).
  rpc InvalidateAllAdminSessions(InvalidateAllAdminSessionsRequest) returns (InvalidateAllAdminSessionsResponse);

  // Story 9.1: Admin gRPC RPCs — User + Room Management
  // ListAdminUsers — paginated user listing for Admin UI.
  rpc ListAdminUsers(ListAdminUsersRequest) returns (ListAdminUsersResponse);

  // GetAdminUser — fetch a single user by user_id for Admin UI.
  rpc GetAdminUser(GetAdminUserRequest) returns (GetAdminUserResponse);

  // DeactivateUser — set is_active=false and invalidate all sessions.
  rpc DeactivateUser(DeactivateUserRequest) returns (DeactivateUserResponse);

  // ReactivateUser — set is_active=true.
  rpc ReactivateUser(ReactivateUserRequest) returns (ReactivateUserResponse);

  // UpdateUserRole — update system_role for a user.
  rpc UpdateUserRole(UpdateUserRoleRequest) returns (UpdateUserRoleResponse);

  // ListAdminRooms — paginated room listing for Admin UI.
  rpc ListAdminRooms(ListAdminRoomsRequest) returns (ListAdminRoomsResponse);

  // GetAdminRoom — fetch a single room by room_id for Admin UI.
  rpc GetAdminRoom(GetAdminRoomRequest) returns (GetAdminRoomResponse);

  // GetServerConfig — fetch current server configuration (oidc_client_secret is intentionally excluded).
  rpc GetServerConfig(GetServerConfigRequest) returns (GetServerConfigResponse);

  // UpdateServerConfig — upsert server configuration fields.
  rpc UpdateServerConfig(UpdateServerConfigRequest) returns (UpdateServerConfigResponse);

  // UpgradeRoom — Story 9.8: atomic room version upgrade.
  // Creates tombstone in old room, creates new room with predecessor,
  // copies state, and invites all old members.
  rpc UpgradeRoom(UpgradeRoomRequest) returns (UpgradeRoomResponse);

  // ListAdminRoomMembers — Story 9.18: fetch current members of a room for Admin UI.
  // Returns all members where left_at IS NULL, ordered by joined_at ASC.
  // Returns empty list (not an error) when the room has no current members.
  rpc ListAdminRoomMembers(ListAdminRoomMembersRequest) returns (ListAdminRoomMembersResponse);

  // GetRelations — Story 9-28: returns events that relate to a given parent event
  // via the specified rel_type (e.g. "m.thread").
  // Returns PERMISSION_DENIED if user is not a room member.
  // Returns NOT_FOUND if the parent event does not exist.
  rpc GetRelations(GetRelationsRequest) returns (GetRelationsResponse);

  // GetEvent — Story 11-8: fetches a single event by ID, scoped to a room.
  // Implements GET /_matrix/client/v3/rooms/{roomId}/event/{eventId}.
  // Returns PERMISSION_DENIED if user is not a room member.
  // Returns NOT_FOUND if the event does not exist in the room.
  rpc GetEvent(GetEventRequest) returns (GetEventResponse);

  // SearchMessages — Story 11.3: Full-text search over rooms the user is a member of.
  // user_id in the request is for documentation/auditing only — the handler MUST use
  // x-user-id from gRPC metadata, never from the request body.
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);

  // BulkImportUsers — Story 14-3a: provisions OIDC users with the same flow as first login.
  // Each entry is processed in sequence; duplicates (signing_key_id IS NOT NULL) are skipped.
  // Returns aggregate counts: imported + skipped + failed = len(users).
  // Partial success is allowed — an error on one user does not abort others.
  rpc BulkImportUsers(BulkImportUsersRequest) returns (BulkImportUsersResponse);

  // SetRoomState — Spaces S2: generic Matrix state-event write
  // (PUT /_matrix/client/v3/rooms/{roomId}/state/{eventType}/{stateKey}).
  // Enforces an ALLOWLIST of writable state types (m.space.child/parent,
  // m.room.name/topic/avatar/join_rules/canonical_alias/history_visibility/guest_access)
  // and a power-level check (sender PL >= state_default). m.room.member /
  // m.room.power_levels / m.room.create are rejected (403) — they have dedicated
  // authorized paths and must NOT be forgeable here. For m.space.parent the parent
  // space must exist (404 otherwise) and the sender must be a member of it (403 otherwise).
  rpc SetRoomState(SetRoomStateRequest) returns (SetRoomStateResponse);

  // GetSpaceHierarchy — Spaces S3: MSC2946 space hierarchy read
  // (GET /_matrix/client/v1/rooms/{roomId}/hierarchy).
  // Breadth-first traversal over m.space.child state events from root_room_id,
  // applying max_depth, suggested_only and a visibility filter (rooms the user
  // cannot see are excluded from the response but their children are still
  // traversed). The ROOT visibility gate is enforced by the server wrapper: a
  // non-member of a private / non-world-readable space → permission_denied (403)
  // before any traversal. Results are deterministically ordered and paginated via
  // an opaque from_token / next_batch_token (fail-closed on a forged token).
  rpc GetSpaceHierarchy(GetSpaceHierarchyRequest) returns (GetSpaceHierarchyResponse);
}

// Shared event type used across multiple RPCs
message Event {
  string event_id          = 1;
  string room_id           = 2;
  string sender_id         = 3;
  string event_type        = 4;
  bytes  content           = 5;  // JSON-encoded event content
  int64  origin_ts         = 6;  // Unix milliseconds
  int64  server_ts         = 7;  // Unix milliseconds
  string state_key         = 8;  // Matrix state_key (subject of state event, e.g. user_id for m.room.member)
  bytes  unsigned_relations = 9; // Story 9-28: JSON {"m.thread":{"count":N,"latest_event":{...},"current_user_participated":bool}}
  // Bugfix unsigned-replaces-state (Matrix CS API v1.19): event_id of the state
  // event this one replaced at its (room_id, event_type, state_key) slot. Only
  // ever populated when this Event is itself a state event (is_state_event ==
  // true) AND a predecessor exists. "" = absent (AC3 — never a sentinel null,
  // this plain-string proto field's own zero value IS the "absent" signal,
  // same idiom as event_id=="" meaning "no real identity" elsewhere in this
  // file).
  string replaces_state     = 10;
  // Story member-event-prev-content (D10): the predecessor's content (JSON text
  // of the object) and sender at the same slot. Set TOGETHER with replaces_state
  // (never one without the others) and only for a state event with a predecessor;
  // "" = absent. Rendered by Nebu.Matrix.Http as unsigned.prev_content /
  // unsigned.prev_sender next to unsigned.replaces_state.
  string prev_content       = 12;
  string prev_sender        = 13;
  // Code-review cycle 1 (MAJOR-2): `state_key` alone is ambiguous once a
  // genuine state event's state_key is "" (e.g. m.room.name/topic/
  // power_levels/create) — that collapses onto the exact same "" as a plain
  // non-state event (m.room.message). This boolean is the authoritative
  // signal (same idiom as SendEventRequest.is_state_event above, SEC Gate 1)
  // so `Nebu.Matrix.Http.put_state_key/2` can correctly decide whether to
  // emit `state_key` at all, including as an empty string for a genuine state
  // event. Always true when this Event is a state event, regardless of its
  // state_key value.
  bool   is_state_event      = 11;
  // Story state-writer-redaction (D5, D6): the target of a writer-made redaction
  // event (rendered as the top-level `redacts` and `content.redacts`) and, for a
  // redacted event, the served redaction event as JSON text of an object
  // (rendered as unsigned.redacted_because, the content then being {}).
  // "" = absent (never null).
  string redacts            = 14;
  string redacted_because   = 15;
}

// SendEvent
message SendEventRequest {
  string room_id        = 1;
  string sender_id      = 2;
  string event_type     = 3;
  string txn_id         = 4;  // idempotency key
  bytes  content        = 5;
  int64  origin_ts      = 6;  // Unix milliseconds
  string state_key      = 7;  // Story 9-7: Matrix state_key (may be "" for types like m.room.name)
  bool   is_state_event = 8;  // SEC Gate 1: true when this is a state event (even if state_key="")
}
message SendEventResponse {
  string event_id = 1;
}

// RedactEvent — story state-writer-redaction (D1, D7, D13): PUT /rooms/{roomId}/redact/{eventId}/{txnId}.
// content_json is the validated body object without a `redacts` key (the path wins); decided and written by
// the room process (Room.Server.redact/5).
message RedactEventRequest {
  string room_id      = 1;
  string sender_id    = 2;
  string event_id     = 3;  // the target
  string txn_id       = 4;  // idempotency key, scoped to the /redact path and the target
  string content_json = 5;
}
message RedactEventResponse {
  string event_id = 1;
}

// CreateRoom
message CreateRoomRequest {
  string          creator_id = 1;
  optional string name       = 2;
  optional string topic      = 3;
  bool            is_direct  = 4;
  // Matrix Spaces (spaces-elixir s1): room_type carries the creation_content.type
  // verbatim (e.g. "m.space"); empty string for an ordinary room. Persisted to the
  // rooms.room_type column. creation_content_json is the raw client-supplied
  // creation_content object (JSON), merged into m.room.create content so extra
  // keys are forwarded (server keeps creator/room_version authoritative). "" when absent.
  string          room_type             = 5;
  string          creation_content_json = 6;
  // Matrix CS POST /createRoom `initial_state`: a JSON-encoded array of
  // { "type", "state_key", "content" } objects, applied as creator-authored
  // state events after the base events (create → creator join → power_levels)
  // and before name/topic. "" when absent. Cannot clobber m.room.create or
  // forge another user's m.room.member (see EventDispatcher.Server.create_room/2).
  string          initial_state_json    = 7;
  // Story create-room-input-validation (comment-level parity only: the in-process
  // Elixir struct Core.CreateRoomRequest carries these two as RAW client JSON values
  // so the core can tell a wrong type (M_BAD_JSON) from a wrong value; they are not
  // wire fields): `room_version` (nil/absent = server default "10", anything but the
  // supported string = 400 M_UNSUPPORTED_ROOM_VERSION) and `room_alias_name` (the
  // desired alias localpart; nil/absent = no explicit alias, see
  // EventDispatcher.Server.validate_create_room_request/1).
  // Story create-room-presets-power-levels-topic (same comment-level parity; raw
  // client JSON values of any type in the in-process struct): `preset`
  // (private_chat | public_chat | trusted_private_chat; nil/absent = derived from
  // `visibility`), `visibility` (public | private; nil/absent = private),
  // `power_level_content_override` (an object merged shallowly over the default
  // m.room.power_levels content; nil/absent = nothing) and `topic` above (a raw
  // value; the router answers a PRESENT JSON null with 400 M_BAD_JSON, the core
  // reads nil as absent).
  // Story create-room-invites-direct (same comment-level parity): `invite` (a raw
  // client value of any type; the core validates a list of at most 50 local user
  // ids, nil/absent = no invitations) and `invite_3pid` (a raw client value; the core
  // refuses every well-shaped third-party invite with 403 M_THREEPID_DENIED, nil / []
  // = none). `is_direct` above is a boolean; the router answers a present non-boolean,
  // non-null value with 400 M_BAD_JSON.
}
message CreateRoomResponse {
  string room_id = 1;
}

// JoinRoom
message JoinRoomRequest {
  string user_id          = 1;
  string room_id_or_alias = 2;
}
message JoinRoomResponse {
  string room_id = 1;
}

// LeaveRoom
message LeaveRoomRequest {
  string user_id = 1;
  string room_id = 2;
}
message LeaveRoomResponse {
  string room_id = 1;
}

// GetMessages
message GetMessagesRequest {
  string          room_id    = 1;
  string          from_token = 2;
  optional string to_token   = 3;
  int32           limit      = 4;
  string          direction  = 5;  // "b" (backward) or "f" (forward)
}
message GetMessagesResponse {
  repeated Event events     = 1;
  string         next_batch = 2;
  string         prev_batch = 3;
}

// SetPresence
message SetPresenceRequest {
  string          user_id    = 1;
  string          presence   = 2;  // "online", "offline", "unavailable"
  optional string status_msg = 3;
}
message SetPresenceResponse {}

// SetTyping
message SetTypingRequest {
  string room_id    = 1;
  string user_id    = 2;
  bool   typing     = 3;
  int32  timeout_ms = 4;
}
message SetTypingResponse {}

// ValidateToken — Go validates OIDC token, Elixir trusts Go fully (ADR G2)
// user_id and system_role arrive via gRPC metadata (x-user-id, x-system-role).
// display_name and email are for new-user provisioning only.
message ValidateTokenRequest {
  reserved 1;               // was: token (removed per ADR G2 — no token forwarding)
  string display_name = 2;  // OIDC preferred_username claim (Operational PII, Tier 1)
  string email        = 3;  // OIDC email claim (Sensitive PII, Tier 2)
}
message ValidateTokenResponse {
  reserved 1;               // was: valid (redundant — success = valid, errors use gRPC status codes)
  string user_id      = 2;  // @{sub}:{server_name}
  string system_role  = 3;  // "user" | "instance_admin" | "compliance_officer"
  string display_name = 4;  // Decrypted from Operational PII (Tier 1)
  bool   is_active    = 5;  // User account status
}

// GetPendingEvents — GELB-status fallback (unary polling instead of streaming)
message GetPendingEventsRequest {
  string node_id     = 1;
  string since_token = 2;
}
message GetPendingEventsResponse {
  repeated Event events     = 1;
  string         next_token = 2;
}

// EventBus — server-streaming, one stream per Go gateway instance
message EventBusRequest {
  string          node_id     = 1;
  optional string since_token = 2;
}

// GetMetrics — Admin Dashboard live metrics (Epic 3 skeleton; full implementation Epic 4)
message GetMetricsRequest {}

message GetMetricsResponse {
  float  msg_per_sec      = 1;  // messages per second (rolling 60s window)
  int32  active_sessions  = 2;  // currently active user sessions
  int32  room_count       = 3;  // total number of active rooms
}

// InviteUser
message InviteUserRequest {
  string room_id    = 1;
  string inviter_id = 2;  // caller (must be room member)
  string invitee_id = 3;  // user to invite
}
message InviteUserResponse {}

// GetRoomState — unary: Go queries current room members + metadata
message GetRoomStateRequest {
  string room_id    = 1;
  string event_type = 2;  // optional filter; empty = return all state events
  string state_key  = 3;  // optional; only meaningful when event_type is set
}
message GetRoomStateResponse {
  repeated string            members           = 1;  // kept for /members backward compat
  string                     power_levels_json = 2;  // kept for /members backward compat
  string                     room_name         = 3;  // kept for backward compat
  repeated SyncRoomStateEvent state_events     = 4;  // Story 7-19: full state array
}

// SetPowerLevels — update room power levels (caller must have change_state power)
message SetPowerLevelsRequest {
  string room_id           = 1;
  string power_levels_json = 2;  // JSON string of full power_levels map
}
message SetPowerLevelsResponse {}

// SendReceipt — persists a read receipt for a user in a room
message SendReceiptRequest {
  string room_id      = 1;
  string user_id      = 2;
  string receipt_type = 3;  // always "m.read" at MVP
  string event_id     = 4;
}
message SendReceiptResponse {}

// GetInitialSync — returns full state snapshot for all of a user's joined rooms
message GetInitialSyncRequest {
  string user_id   = 1;
  string device_id = 2;  // story sync-token-per-device (D1, D4): since-token key of the authenticated device; "" = the per-user row (device-less clients)
}

// NOTE (story sync-membership-partition): the /sync partition fields below (join_room_ids, invite_rooms, leave_rooms,
// SyncInviteRoom, StrippedStateEvent, full_state) were added to the hand-maintained structs in server/lib/pb/core.pb.ex;
// this file documents them in parity (no codegen, ADR-021). `rooms` stays the DELIVERED joined rooms.
message GetInitialSyncResponse {
  string                  since_token   = 1;  // opaque token — becomes next_batch in HTTP response
  repeated SyncRoom       rooms         = 2;  // joined rooms (the initial sync delivers every one of them)
  repeated string         join_room_ids = 3;  // the WHOLE join class (delivered or not)
  repeated SyncInviteRoom invite_rooms  = 4;  // rooms.invite: stripped invite_state per pending invitation
  repeated SyncRoom       leave_rooms   = 5;  // rooms.leave: always empty in an initial sync (no include_leave support)
}

// StrippedStateEvent: exactly the four properties the Matrix spec allows in invite_state.
message StrippedStateEvent {
  string type      = 1;
  string state_key = 2;
  string sender    = 3;
  bytes  content   = 4;  // JSON-encoded content
}

message SyncInviteRoom {
  string                      room_id      = 1;
  repeated StrippedStateEvent invite_state = 2;
}

// SyncRoomStateEvent represents a state event in a SyncRoom (needs state_key)
//
// NOTE: no longer generated from this file — server/lib/pb/core.pb.ex is a
// hand-maintained plain Elixir defstruct (ADR-021, grpc-removal). Kept here for
// historical/reference documentation only; update both files by hand together.
//
// Bugfix sync-state-events-missing-fields: event_id/origin_server_ts added so
// rooms.join.*.state.events entries carry the same required ClientEventWithoutRoomID
// identity fields as timeline.events (Matrix CS API spec) — both are REAL persisted
// values, not synthesized.
message SyncRoomStateEvent {
  string type             = 1;  // e.g. "m.room.member", "m.room.power_levels"
  string state_key        = 2;
  bytes  content          = 3;  // JSON-encoded content
  string sender           = 4;
  string event_id         = 5;  // real persisted event_id (never synthesized)
  int64  origin_server_ts = 6;  // real persisted timestamp, epoch ms
  // Bugfix unsigned-replaces-state (Matrix CS API v1.19): event_id of the state
  // event previously current at this (room_id, type, state_key) slot, if any.
  // "" = absent (AC3 — e.g. always for m.room.create, or any first-ever write
  // at a slot) — never a sentinel null.
  string replaces_state    = 7;
  // Story member-event-prev-content (D10): same meaning as Event.prev_content /
  // Event.prev_sender (JSON text of the predecessor's content; "" = no predecessor).
  string prev_content      = 8;
  string prev_sender       = 9;
}

// GetSyncDelta — incremental sync request with long-polling
message GetSyncDeltaRequest {
  string user_id     = 1;
  string since_token = 2;  // opaque token from previous next_batch
  int64  timeout_ms  = 3;  // long-poll wait time; 0 = return immediately; max 30000
  string device_id   = 4;  // device-scoped since-token lookup key (Story 9-22)
  bool   full_state  = 5;  // sync-membership-partition (D14): every joined room with its full state, returns at once
}

message GetSyncDeltaResponse {
  string                  since_token           = 1;  // new next_batch token for the client
  repeated SyncRoom       rooms                 = 2;  // joined rooms with new events (+ full_state rooms)
  bool                    fallback_to_initial   = 3;  // true if since_token was unknown → full sync
  repeated string         join_room_ids         = 4;  // sync-membership-partition: the WHOLE join class
  repeated SyncInviteRoom invite_rooms          = 5;  // NEW invitations since the token (stripped invite_state)
  repeated SyncRoom       leave_rooms           = 6;  // NEW leaves: timeline bounded at the leave event, state empty
  repeated string         newly_joined_room_ids = 7;  // sync-stream-position: join rooms that were no joined room of the device's base
}

// SyncRoom represents one room's snapshot: a joined room's state and timeline (initial sync, incremental delta), or the leave window of
// a room the user left (leave_rooms: empty state_events, the timeline bounded at the leave event)
message SyncRoom {
  string                      room_id              = 1;
  repeated SyncRoomStateEvent state_events         = 2;
  repeated Event              timeline_events      = 3;
  bool                        limited              = 4;  // true if timeline was truncated at 20
  string                      prev_batch           = 5;  // pagination token for GET /messages
  repeated string             heroes               = 6;  // m.heroes — max 5 participant user_ids (§11.2.2)
  int32                       joined_member_count  = 7;  // m.joined_member_count
  int32                       invited_member_count = 8;  // m.invited_member_count
}

// GetPresence — reads from Presence.Manager ETS, never raises not_found (offline default)
message GetPresenceRequest {
  string user_id = 1;
}
message GetPresenceResponse {
  string presence        = 1;  // "online" | "offline" | "unavailable"
  int64  last_active_ago = 2;  // milliseconds since last active (0 if never seen)
}

// UpdateProfile — upserts displayname and/or avatar_url in the profiles table
// Fields are optional strings: empty string = do not update that field
message UpdateProfileRequest {
  string user_id     = 1;
  string displayname = 2;  // empty = not updating displayname
  string avatar_url  = 3;  // empty = not updating avatar_url
}
message UpdateProfileResponse {}

// WriteAuditLog — persists one audit record in a separate DB transaction.
// Go gateway sends admin-layer events (login, logout, bootstrap) via this RPC.
// Room events are written directly by Elixir (no gRPC roundtrip needed).
message WriteAuditLogRequest {
  string actor_user_id = 1;
  string action        = 2;
  string target_type   = 3;  // empty string for null
  string target_id     = 4;  // empty string for null
  bytes  metadata_json = 5;  // JSON-encoded map; empty bytes = {}
  string outcome       = 6;
  string error_detail  = 7;  // empty string = not applicable
}
message WriteAuditLogResponse {
  bool ok = 1;
}

// DeleteUserKeys — Story 5.7: atomically soft-deletes private signing + encryption keys for a user.
// Elixir Core runs a 5-step Ecto.Multi; on failure a separate Repo.transaction writes the
// "user_keys_deletion_attempted" audit record (failure invariant, AC3).
message DeleteUserKeysRequest {
  string admin_user_id  = 1;  // caller (instance_admin) subject
  string target_user_id = 2;  // user whose keys are to be deleted
  string reason         = 3;  // DSGVO deletion reason (min 10 chars, already validated by Go)
}
message DeleteUserKeysResponse {
  string status          = 1;  // "keys_deleted"
  int64  keys_deleted_at = 2;  // Unix milliseconds — convert to ISO8601 in Go handler
}

// KickUser — room moderator action; power check enforced by GenServer
message KickUserRequest {
  string room_id   = 1;
  string caller_id = 2;  // user performing the kick
  string target_id = 3;  // user to kick
  string reason    = 4;  // optional
}
message KickUserResponse {}

// BanUser — bans a user from a room; power check enforced by GenServer
message BanUserRequest {
  string room_id   = 1;
  string caller_id = 2;
  string target_id = 3;
  string reason    = 4;  // optional
}
message BanUserResponse {}

// UnbanUser — removes ban (sets membership: leave); power check enforced by GenServer
message UnbanUserRequest {
  string room_id   = 1;
  string caller_id = 2;
  string target_id = 3;
  string reason    = 4;  // optional (story moderation-routes-atomic-ban, D10)
}
message UnbanUserResponse {}

// ForgetRoom — marks a room as excluded from future /sync for the calling user
message ForgetRoomRequest {
  string room_id = 1;
  string user_id = 2;
}
message ForgetRoomResponse {}

// ListPublicRooms — Story 7-27
// Cursor: since is the room_id of the last item on the previous page (lexicographic).
// filter_term: case-insensitive substring match on room name and topic (ILIKE '%term%').
message ListPublicRoomsRequest {
  int32  limit       = 1;  // max rooms per page; 0 = default 20; server caps at 100
  string since       = 2;  // opaque cursor from previous next_cursor; empty = first page
  string filter_term = 3;  // generic_search_term; empty = no filter
}

// RoomSummary represents one public room entry in the directory.
message RoomSummary {
  string room_id            = 1;
  string name               = 2;
  string topic              = 3;
  int32  num_joined_members = 4;  // live count from Room GenServer (or DB fallback)
  bool   world_readable     = 5;  // always false for Nebu rooms
  bool   guest_can_join     = 6;  // always false for Nebu rooms
}

message ListPublicRoomsResponse {
  repeated RoomSummary rooms          = 1;
  string               next_cursor    = 2;  // empty when no more pages
  int32                total_estimate = 3;  // approximate total public room count
}

// GetEventContext — Story 7-28
// Returns the target event, up to `limit` events before and after it, a state
// snapshot at the time of the event, and pagination tokens that are compatible
// with GetMessages (start is usable as `to`, end as `from`).
message GetEventContextRequest {
  string room_id  = 1;
  string event_id = 2;
  int32  limit    = 3;  // events before AND after; 0 = default 10; clamped to 100
}

// ContextStateEvent is a state event in the context snapshot (needs state_key).
message ContextStateEvent {
  string event_type = 1;
  string state_key  = 2;
  bytes  content    = 3;  // JSON-encoded
  string sender     = 4;
}

message GetEventContextResponse {
  Event                      event         = 1;  // the target event itself
  repeated Event             events_before = 2;  // up to `limit` events older than event (newest last)
  repeated Event             events_after  = 3;  // up to `limit` events newer than event (oldest first)
  repeated ContextStateEvent state         = 4;  // state snapshot at event time
  string                     start_token   = 5;  // pagination token — use as `to` in GET /messages
  string                     end_token     = 6;  // pagination token — use as `from` in GET /messages
}

// InvalidateUserSessions — Story 6.5: Admin deactivation revokes all active sessions.
// Story 9-22: when device_id is set, only the (user_id, device_id) session is invalidated
// (per-device logout). When device_id is empty, all sessions for the user are invalidated
// (admin deactivation / full logout).
// Calls SessionManager.destroy_session/1 or /2 depending on device_id presence.
// Returns ok=true on success; gRPC error on DB failure.
message InvalidateUserSessionsRequest {
  string user_id   = 1;  // Matrix user ID (@localpart:server)
  string device_id = 2;  // Optional: if set, only invalidate this device's session (Story 9-22)
}

message InvalidateUserSessionsResponse {
  bool ok = 1;
}

// UpdateRoomSettings — Story 6.8 + admin-auto-join-rooms
message UpdateRoomSettingsRequest {
  string room_id     = 1;
  int32  max_members = 2;  // 0 = no limit; always sent (even if unchanged) for simplicity
  optional bool is_auto_join = 3;  // absent = do not change; true/false = set value
  string visibility = 4;           // "public" | "private" | "" = no change (rm1-room-visibility)
}
message UpdateRoomSettingsResponse {
  bool ok = 1;
}

// ArchiveRoom — Story 6.9
message ArchiveRoomRequest {
  string room_id = 1;
}
message ArchiveRoomResponse {
  bool ok = 1;
}

// UnarchiveRoom — Story 6.9
message UnarchiveRoomRequest {
  string room_id = 1;
}
message UnarchiveRoomResponse {
  bool ok = 1;
}

// InvalidateAllAdminSessions — Story 6.10
message InvalidateAllAdminSessionsRequest {}

message InvalidateAllAdminSessionsResponse {
  bool ok = 1;
}

// ── Story 9.1: Admin gRPC messages ──────────────────────────────────────────

// AdminUserProto — user record for admin RPCs
message AdminUserProto {
  string user_id      = 1;
  string display_name = 2;
  string email_masked = 3;  // masked: u***@domain
  bool   is_active    = 4;
  string system_role  = 5;  // "user" | "instance_admin" | "compliance_officer"
  int64  created_at   = 6;  // Unix milliseconds
}

// ListAdminUsers
message ListAdminUsersRequest {
  int32  limit  = 1;   // 1–100, default 20
  string cursor = 2;   // opaque cursor (user_id); empty = first page
  string search = 3;   // ILIKE substring match on display_name; empty = no filter
}
message ListAdminUsersResponse {
  repeated AdminUserProto users       = 1;
  int32                   total       = 2;
  string                  next_cursor = 3;  // empty = no more pages
}

// GetAdminUser
message GetAdminUserRequest  { string user_id = 1; }
message GetAdminUserResponse { AdminUserProto user = 1; }

// DeactivateUser
message DeactivateUserRequest  { string user_id = 1; }
message DeactivateUserResponse { bool ok = 1; }

// ReactivateUser
message ReactivateUserRequest  { string user_id = 1; }
message ReactivateUserResponse { bool ok = 1; }

// UpdateUserRole
message UpdateUserRoleRequest  {
  string user_id = 1;
  string role    = 2;  // "user" | "instance_admin" | "compliance_officer"
}
message UpdateUserRoleResponse { bool ok = 1; }

// AdminRoomProto — room summary for admin RPCs
message AdminRoomProto {
  string room_id      = 1;
  string name         = 2;
  string status       = 3;  // "active" | "archived"
  int32  member_count = 4;
  int64  created_at   = 5;  // Unix milliseconds
}

// AdminRoomDetailProto — full room detail
message AdminRoomDetailProto {
  string room_id      = 1;
  string name         = 2;
  string status       = 3;
  int32  member_count = 4;
  int32  max_members  = 5;  // 0 = no limit
  string visibility   = 6;  // "public" | "private"
  int64  created_at   = 7;
  bool   is_auto_join = 8;  // true = new users auto-joined on first login
}

// ListAdminRooms
message ListAdminRoomsRequest {
  int32  limit         = 1;
  string cursor        = 2;   // empty = first page
  string status_filter = 3;   // "active" | "archived" | "" (all)
  string search        = 4;
}
message ListAdminRoomsResponse {
  repeated AdminRoomProto rooms       = 1;
  int32                   total       = 2;
  string                  next_cursor = 3;
}

// GetAdminRoom
message GetAdminRoomRequest  { string room_id = 1; }
message GetAdminRoomResponse { AdminRoomDetailProto room = 1; }

// ServerConfigProto — server configuration (oidc_client_secret intentionally absent)
message ServerConfigProto {
  string instance_name            = 1;
  string oidc_issuer              = 2;
  string oidc_client_id           = 3;
  int32  room_default_max_members = 4;
  string room_default_visibility  = 5;
  int32  audit_log_retention_days = 6;
  // Story 14-2a: OIDC Directory Integration (ADR-015 Protocol A)
  bool   oidc_directory_enabled   = 7;
  string oidc_directory_endpoint  = 8;
}

// GetServerConfig
message GetServerConfigRequest  {}
message GetServerConfigResponse { ServerConfigProto config = 1; }

// UpdateServerConfig — all fields optional (empty string / zero = do not update)
message UpdateServerConfigRequest {
  string instance_name            = 1;
  string oidc_issuer              = 2;
  string oidc_client_id           = 3;
  int32  room_default_max_members = 4;
  string room_default_visibility  = 5;
  int32  audit_log_retention_days = 6;
  // Story 14.1a: locked post-bootstrap (maps to DB key oidc_user_id_claim).
  // Once bootstrap_completed is set, any non-empty value raises FAILED_PRECONDITION.
  string matrix_user_id_claim     = 7;
  // Story 14-2a: OIDC Directory Integration (ADR-015 Protocol A)
  // Note: use optional wrapper fields since bool defaults to false and string to "".
  // The Admin UI path uses direct DB upsert (not gRPC) for these fields, so the
  // proto fields are added for completeness / future gRPC-path use.
  bool   oidc_directory_enabled   = 8;
  string oidc_directory_endpoint  = 9;
}
message UpdateServerConfigResponse { bool ok = 1; }

// UpgradeRoom — Story 9.8: atomic room version upgrade
message UpgradeRoomRequest {
  string old_room_id  = 1;
  string requester_id = 2;  // must be room owner (power_level >= 100)
  string new_version  = 3;  // e.g. "10"
}

message UpgradeRoomResponse {
  string new_room_id = 1;
}

// AdminRoomMemberProto — Story 9.18: one member row in ListAdminRoomMembersResponse.
// display_name is decrypted by the Elixir Core before sending; empty string on failure.
message AdminRoomMemberProto {
  string user_id      = 1;
  string display_name = 2;  // decrypted; empty string if decryption fails
  int64  joined_at    = 3;  // Unix milliseconds
}

// ListAdminRoomMembers — Story 9.18
message ListAdminRoomMembersRequest  { string room_id = 1; }
message ListAdminRoomMembersResponse { repeated AdminRoomMemberProto members = 1; }

// GetRelations — Story 9-28 / 9-29
// Returns all events that relate to parent_event_id via rel_type (e.g. "m.thread").
// Story 9-29: rel_type empty = all relation types; event_type filters further.
// dir: "b" = newest-first (DESC, default), "f" = oldest-first (ASC).
// recurse: accepted without error; MVP passes through (Core may ignore).
// from: opaque pagination token; empty = start from newest (dir=b) or oldest (dir=f).
// Caller must be a joined member of the room.
message GetRelationsRequest {
  string user_id    = 1;
  string room_id    = 2;
  string event_id   = 3;  // parent event ID (thread root)
  string rel_type   = 4;  // e.g. "m.thread"; empty = all relation types (Story 9-29)
  int32  limit      = 5;  // 0 = default 20; clamped to 100
  string event_type = 6;  // filter by event type; empty = all event types (Story 9-29)
  string dir        = 7;  // "f" or "b" (default "b" = newest-first DESC) (Story 9-29)
  bool   recurse    = 8;  // accepted without error; MVP: same as dir=b (Story 9-29)
  string from       = 9;  // opaque pagination token; empty = first page (Story 9-29)
}

message GetRelationsResponse {
  repeated Event events     = 1;
  string         next_batch = 2;  // empty when no more pages
  string         prev_batch = 3;  // for dir=b pagination (Story 9-29)
}

// ── Story 11-8: GetEvent messages ────────────────────────────────────────────

// GetEventRequest — Story 11-8: fetch a single event by ID, scoped to a room.
// Caller identity is sourced from gRPC metadata (x-user-id), not from user_id field.
message GetEventRequest {
  string room_id  = 1;
  string event_id = 2;
  // user_id is documentation/auditing only — the handler MUST use x-user-id
  // from gRPC metadata (Nebu.Grpc.Metadata.trusted_identity), never from this field.
  string user_id  = 3;
}

// GetEventResponse — Story 11-8: the target event, fully serialized.
// Returns NOT_FOUND if event does not exist in room.
// Returns PERMISSION_DENIED if user is not a room member.
message GetEventResponse {
  Event event = 1;
}

// ── Story 11.3: SearchMessages gRPC messages ─────────────────────────────────

// ProfileInfo — one entry in SearchResult.profile_info map (keyed by user_id).
message ProfileInfo {
  string displayname = 1;
  string avatar_url  = 2;
}

// SearchResult — one hit in a SearchMessagesResponse.
message SearchResult {
  float             rank           = 1;  // ts_rank_cd score; higher = more relevant
  bytes             event          = 2;  // raw event JSON (same encoding as other bytes fields)
  repeated bytes    events_before  = 3;  // up to 5 events before result event in same room
  repeated bytes    events_after   = 4;  // up to 5 events after result event in same room
  map<string, ProfileInfo> profile_info = 5;  // keyed by user_id (sender + context senders)
}

// SearchMessagesRequest — Story 11.3: SearchMessages gRPC handler.
// SECURITY: user_id field is IGNORED by the handler — user_id is extracted from
// x-user-id gRPC metadata (set by Go JWTMiddleware). This field is present only
// for client auditing/documentation; treating it as authoritative would bypass
// all membership enforcement.
message SearchMessagesRequest {
  string          user_id        = 1;  // IGNORED by handler — use x-user-id metadata
  string          search_term    = 2;
  repeated string room_filter    = 3;  // client-requested room filter; intersected with membership
  repeated string sender_filter  = 4;  // optional sender restriction (not yet enforced at DB layer)
  int32           limit          = 5;  // 0 = default 10; server clamps to 1–100
  string          next_batch     = 6;  // opaque pagination token (base64-encoded offset int)
}

// SearchMessagesResponse — Story 11.3.
message SearchMessagesResponse {
  repeated SearchResult results     = 1;
  string                next_batch  = 2;  // empty when no more results
  int32                 total_count = 3;  // approximate total matching events (for UI display)
}

// ── Story 14-3a: BulkImportUsers messages ────────────────────────────────────

// OIDCUserClaims — one user's OIDC claim map for bulk import.
// user_id: Matrix user ID derived from the configured matrix_user_id_claim
//          (e.g. "@alice:example.com") — computed by the Go gateway before sending.
// system_role is intentionally ABSENT: the Core handler hard-codes "user" for all
//   bulk-imported accounts — callers must not control privilege escalation.
//   (SEC Gate 2 F-2: removed to prevent privilege escalation via caller-supplied role.)
// display_name: from preferred_username OIDC claim (Tier 1 PII — encrypted in Core).
// email: from email OIDC claim (Tier 2 PII — encrypted in Core via X25519 ECDH).
message OIDCUserClaims {
  string user_id      = 1;
  // field 2 (system_role) reserved — removed for security; Core hard-codes "user"
  reserved 2;
  reserved "system_role";
  string display_name = 3;
  string email        = 4;
}

// BulkImportUsersRequest — Story 14-3a
message BulkImportUsersRequest {
  repeated OIDCUserClaims users = 1;
}

// BulkImportUsersResponse — Story 14-3a
// imported: users newly created in this call (user record + keypairs + encrypted PII).
// skipped: users already in DB with full keypairs (signing_key_id IS NOT NULL) — no-op.
// failed: users that encountered a DB or crypto error (partial success, not an abort).
message BulkImportUsersResponse {
  int32 imported = 1;
  int32 skipped  = 2;
  int32 failed   = 3;
}

// ── Spaces S2: SetRoomState messages ─────────────────────────────────────────

// SetRoomStateRequest — Spaces S2: generic state-event write.
// sender_id is the authenticated caller (from the trusted stream / x-user-id);
// the server builds all top-level event fields (type, room_id, event_id,
// origin_server_ts) — only event_type, state_key and content_json come from the
// client. content_json is the raw client-supplied content object as JSON;
// malformed JSON is treated as {} (empty content = unlink for m.space.child).
message SetRoomStateRequest {
  string room_id      = 1;
  string sender_id    = 2;  // authenticated caller (trusted identity)
  string event_type   = 3;  // must be on the allowlist (else 403)
  string state_key    = 4;  // may be "" (no-state-key variant)
  string content_json = 5;  // raw client content object (JSON); malformed → {}
}

message SetRoomStateResponse {
  string event_id = 1;
}

// ── Spaces S3: GetSpaceHierarchy messages (MSC2946) ──────────────────────────

// GetSpaceHierarchyRequest — Spaces S3: space hierarchy read.
// root_room_id + user_id are server-trusted (user_id from the authenticated
// token, never the path/body). limit / max_depth / suggested_only / from_token
// are the parsed-and-validated query params; the HTTP layer rejects a malformed
// suggested_only or a negative limit (400) and clamps limit to <= 1000.
message GetSpaceHierarchyRequest {
  string root_room_id   = 1;
  string user_id        = 2;  // authenticated caller (trusted identity)
  int32  limit          = 3;  // page size (server-clamped to <= 1000)
  int32  max_depth      = 4;  // BFS depth cap (0 = root only)
  bool   suggested_only = 5;  // only m.space.child with content.suggested == true
  string from_token     = 6;  // opaque pagination cursor; forged → 400 (fail closed)
}

// GetSpaceHierarchyResponse — the BFS-ordered list of visible rooms + the
// opaque continuation token (empty when there are no further pages).
message GetSpaceHierarchyResponse {
  repeated HierarchyRoom rooms      = 1;
  string  next_batch_token          = 2;
}

// HierarchyRoom — one room summary in the hierarchy response (MSC2946 shape).
// children_state_json is the JSON array of the room's stripped m.space.child
// state events (only present for rooms the user may see).
message HierarchyRoom {
  string room_id              = 1;
  string name                 = 2;
  string topic                = 3;
  string canonical_alias      = 4;
  int32  num_joined_members   = 5;
  bool   world_readable       = 6;
  bool   guest_can_join       = 7;
  string join_rule            = 8;
  string room_type            = 9;   // "m.space" for sub-spaces, "" otherwise
  string avatar_url           = 10;
  string children_state_json  = 11;  // JSON array of stripped m.space.child events
}
