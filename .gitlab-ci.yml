# Nebu CI Pipeline
#
# Custom CI images are stored in the GitLab Container Registry and pre-install
# build dependencies (gcc for race detector, hex/rebar for Elixir).
#
# Build jobs rebuild images when their Dockerfiles change.
# Manual trigger available for initial setup (run build-ci-elixir + build-ci-dex
# once before first pipeline run that uses them).
# go-removal-cleanup (full-elixir-stack): the Go layer and all Go CI jobs were removed.
#
# CI image builds use Kaniko — no Docker daemon / DinD required, works on plain
# K8s runners. Only the integration-test job still needs DinD (docker compose
# spins up the full stack); it is routed to a DinD-capable runner via tags.
#
# GitLab Pages (EasyWebsite) — Story 16-1
# Uses the EasyWebsite md-to-web CI component to build the project website
# at website/dokument/ with the opencode theme and publish via GitLab Pages.
# Only runs on release/* branches — publishes docs for each release.
#
# $CI_SERVER_FQDN is a standard GitLab CI predefined variable that resolves to
# the FQDN of the GitLab instance running the pipeline. For this repository
# hosted on gitlab.opencode.de, $CI_SERVER_FQDN = "gitlab.opencode.de".
# Using the variable (rather than a hardcoded hostname) ensures the include
# resolves correctly on any GitLab mirror without modification.
#
# ─── GitLab Pages (EasyWebsite) — Story 16-1 ─────────────────────────────────
# Builds the project website from website/dokument/ using the public
# @document-writing-tools/markdown-webbook CLI and publishes via GitLab Pages.
#
# We run the CLI directly (without the md-to-web CI component) because the
# component's internal version (1.3.15, private opencode registry) uses a
# legacy _meta.yaml API with `children:` that is incompatible with the public
# 2.x API. The public 2.x API is used here — tested locally with
# `scripts/ci-local.sh --docs`.
#
# docs/architecture/ is the single source of truth (NFR-16.2, Story 16-3).
# website/dokument/architecture/ is in .gitignore — CI-generated only.
# architecture/_meta.yaml and architecture/index.md live in docs/architecture/
# and are copied into the build by before_script.
pages:
  stage: deploy
  image: node:22-alpine
  before_script:
    - mkdir -p website/dokument/architecture
    - cp -r docs/architecture/. website/dokument/architecture/
    - cp docs/getting-started.md website/dokument/getting-started.md
    - echo "Injected docs/architecture/ and docs/getting-started.md"
  script:
    - npx --yes @document-writing-tools/markdown-webbook@2.1.0 --input website/dokument --output out --title "Nebu" --theme opencode --copyright "Nebu contributors - Apache 2.0" --logo-path "website/dokument/assets/nebu-logo.svg" --copy-to-public-dir "website/dokument/public-extra"
  artifacts:
    paths:
      - out
    expire_in: 1 week
  pages:
    publish: out
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
variables:
  DOCKER_DRIVER: overlay2
  # go-removal-cleanup (full-elixir-stack): CI_GO_IMAGE removed with the Go layer.
  CI_ELIXIR_IMAGE: $CI_REGISTRY_IMAGE/ci-elixir:1.19
  GITLEAKS_VERSION: "8.24.3"
# Duplicate pipeline prevention:
# feature/* and bugfix/* branches never run branch pipelines — only MR pipelines.
# This eliminates the race condition where a branch pipeline starts before the MR
# exists ($CI_OPEN_MERGE_REQUESTS is empty at push time) and then the MR pipeline
# starts on top of it. Protected branches (main, release/*, hotfix/*) still
# run branch pipelines. Tag pipelines (v*.*.* SemVer) trigger the release stage.
workflow:
  rules:
    # RC/beta tags (v1.0.0-rc1) are intentionally excluded — only stable SemVer triggers release.
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_BRANCH =~ /^hotfix\//'
# Defaults applied to every job unless overridden.
# - `timeout: 30 minutes` bounds runaway jobs (Kassandra 8.6 review M-3).
# - `interruptible: true` cancels superseded pipelines on the same ref so a
#   public OSS repo cannot be DoS'd by rapid pushes.
default:
  timeout: 30 minutes
  interruptible: true
stages:
  - build-ci-images
  - unit
  - verify
  - build
  - integration
  - deploy
  - release
  - test
  - oci-image
  - attestation
# ─── CI Image Builds ──────────────────────────────────────────────────────────
# Kaniko builds container images without a Docker daemon.
# The -debug variant ships a busybox shell so before_script works.
# Credentials are written to /kaniko/.docker/config.json (Kaniko's default
# Docker credential location) — no `docker login` command needed.
.build_ci_image: &build_ci_image
  stage: build-ci-images
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"},"%s":{"auth":"%s"}}}' \
        "${CI_REGISTRY}" \
        "$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')" \
        "${DOCKER_REGISTRY}" \
        "$(printf '%s:%s' "${DOCKER_REGISTRY_USER}" "${DOCKER_REGISTRY_PASS}" | base64 | tr -d '\n')" \
        > /kaniko/.docker/config.json
# go-removal-cleanup (full-elixir-stack): build-ci-go was removed — the Go toolchain
# image is no longer built or used.
build-ci-elixir:
  !!merge <<: *build_ci_image
  script:
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile docker/Dockerfile.ci.elixir --destination "${CI_REGISTRY_IMAGE}/ci-elixir:1.19" --cache=true --cache-ttl=168h
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [docker/Dockerfile.ci.elixir]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [docker/Dockerfile.ci.elixir]
    - when: manual
      allow_failure: true
build-ci-dex:
  !!merge <<: *build_ci_image
  script:
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile docker/Dockerfile.dex-ci --destination "${CI_REGISTRY_IMAGE}/ci-dex:v2.45.1" --cache=true --cache-ttl=168h
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [docker/Dockerfile.dex-ci, dev/dex/config.yaml]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [docker/Dockerfile.dex-ci, dev/dex/config.yaml]
    - when: manual
      allow_failure: true
# ─── Unit Tests ───────────────────────────────────────────────────────────────
# go-removal-cleanup (full-elixir-stack): lint-go and test-unit-go were removed along
# with the Go layer. Only the Elixir unit suite remains.
test-unit-elixir:
  stage: unit
  image: $CI_REGISTRY_IMAGE/ci-elixir:1.19
  script:
    - cd server && mix deps.get && MIX_ENV=test mix compile && mix test --warnings-as-errors
  cache:
    key: "mix-${CI_COMMIT_REF_SLUG}"
    paths:
      - server/deps
      - server/_build
      - ~/.hex
      - ~/.mix
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
    - if: '$CI_COMMIT_BRANCH =~ /^bugfix\//'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
# ─── Secret Scan ──────────────────────────────────────────────────────────────
secret-scan:
  stage: verify
  # go-removal-cleanup (full-elixir-stack): ci-go image removed; this is a shell-only job.
  image: $CI_REGISTRY_IMAGE/ci-elixir:1.19
  timeout: 30 minutes
  interruptible: true
  before_script:
    # ci-elixir is a bare elixir-alpine image (go-removal-cleanup repointed this
    # shell-only job off the removed ci-go image, which had these). gitleaks is
    # downloaded with curl and scans git history; scan-secrets.sh is bash.
    - apk add --no-cache bash curl git
    - git config --global --add safe.directory "${CI_PROJECT_DIR}"
    # Verify gitleaks tarball SHA256 against the upstream checksums file
    # before extracting (Kassandra 8.6 review H-1, CWE-494/829).
    - set -euo pipefail
    - BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
    - TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
    - curl -sSfL -o "${TARBALL}" "${BASE}/${TARBALL}"
    - curl -sSfL -o gitleaks_checksums.txt "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
    - grep "  ${TARBALL}\$" gitleaks_checksums.txt | sha256sum -c -
    - tar -xzf "${TARBALL}" -C /usr/local/bin gitleaks
    - rm -f "${TARBALL}" gitleaks_checksums.txt
  script:
    - scripts/scan-secrets.sh --ci
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
    - if: '$CI_COMMIT_BRANCH =~ /^bugfix\//'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
# ─── Verify Docs ──────────────────────────────────────────────────────────────
verify-docs:
  stage: verify
  # go-removal-cleanup (full-elixir-stack): ci-go image removed; this is a shell-only job.
  image: $CI_REGISTRY_IMAGE/ci-elixir:1.19
  before_script:
    # Bare elixir-alpine image: the verify-*.sh scripts are bash and need python3
    # (manifest validation) + npx markdownlint-cli (node/npm); git diffs the
    # README markdownlint count against HEAD.
    - apk add --no-cache bash python3 nodejs npm git
    - git config --global --add safe.directory "${CI_PROJECT_DIR}"
  script:
    - scripts/verify-readme-attribution.sh
    - scripts/verify-contributing.sh
    - scripts/verify-security-policy.sh
    - scripts/verify-docs.sh
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
    - if: '$CI_COMMIT_BRANCH =~ /^bugfix\//'
      variables:
        MANIFEST_FRESHNESS_WARN_ONLY: "true"
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
# ─── App Image Builds ─────────────────────────────────────────────────────────
# Kaniko builds the server application image and pushes it to the GitLab registry
# tagged with the commit SHA. No DinD required.
# This image is consumed by the integration-test job via docker-compose.ci.yml.
# go-removal-cleanup (full-elixir-stack): build-gateway-image and build-media-image
# were removed — the server is now the only application image.
build-server-image:
  !!merge <<: *build_ci_image
  stage: build
  script:
    - /kaniko/executor --context "${CI_PROJECT_DIR}/server" --dockerfile server/Dockerfile --destination "${CI_REGISTRY_IMAGE}/server:${CI_COMMIT_SHA}" --cache=true --cache-ttl=24h
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
# ─── Pre-release Image Builds (main branch) ───────────────────────────────
# Pushes preview images on every commit to the `main` branch.
# Tags: dev-<CI_PIPELINE_ID> (immutable per run) + dev-latest (mutable pointer).
# These images reflect development state and are NOT intended for production.

# go-removal-cleanup (full-elixir-stack): prerelease-gateway-image was removed.
prerelease-server-image:
  !!merge <<: *build_ci_image
  stage: build
  script:
    - /kaniko/executor --context "${CI_PROJECT_DIR}/server" --dockerfile server/Dockerfile --destination "${CI_REGISTRY_IMAGE}/nebu-server:dev-${CI_PIPELINE_ID}" --destination "${CI_REGISTRY_IMAGE}/nebu-server:dev-latest" --build-arg "GIT_COMMIT=${CI_COMMIT_SHA}" --build-arg "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" --cache=true --cache-ttl=24h
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
# go-removal-cleanup (full-elixir-stack): prerelease-media-image was removed.

# ─── Integration Test ─────────────────────────────────────────────────────────
# Requires DinD: starts docker compose stack, runs Gherkin tests, tears down.
# Test runner joins nebu_default network → reaches server:8080 and server:4000
# by service name (works in DinD where host.docker.internal is not available).
#
# This job is intentionally pinned to runners tagged `docker` — those are the
# only nodes where a privileged Docker daemon is available. Plain K8s runners
# (no DinD) cannot run docker compose.
#
# Job is manual (when: manual) so pipelines on plain K8s runners are not
# blocked. Trigger manually when a docker-tagged runner is available, or run
# locally via `make test-integration`.
integration-test:
  stage: integration
  tags:
    - docker
  image: docker:latest
  services:
    - name: docker:dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache make openssl
    - until docker info; do sleep 1; done
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - echo "$DOCKER_REGISTRY_PASS" | docker login "$DOCKER_REGISTRY" --username "$DOCKER_REGISTRY_USER" --password-stdin
  script:
    - make test-integration-ci
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
# ─── Element Web Browser E2E ───────────────────────────────────────────────────
# Story e2e-browser-ci-and-dex-reliability (epic e2e-test-rehab) — AC3.
#
# Runs the `element-web` Playwright/BDD project against a real Element Web SPA
# driven through the full OIDC Authorization-Code + PKCE flow with Dex up.
#
# Why this job (and why amd64):
#   The `dexidp/dex` image is amd64. On developer Apple-Silicon machines it runs
#   under emulation and is too slow to be a reliable gate — the browser login
#   warmup times out before Dex finishes redirecting. This job pins the work to a
#   docker-tagged amd64 runner where Dex runs NATIVELY, so it is the dependable
#   gate for browser verification (local emulated runs are best-effort only).
#
#   It is pinned to runners tagged `docker` (DinD) because `make test-e2e-element-ci`
#   uses docker compose (Dex + server + element sidecar) and runs Playwright in a
#   host-networked container so the browser reaches the localhost:7070 / :8008 /
#   :5556 origins that the Element config and Dex redirect URIs are registered for.
#
# The Makefile target runs `npm run preflight` first (AC1) — if Dex did not come
# up the job fails fast with "Dex unreachable" instead of a 30s navigation timeout.
#
# Manual + allow_failure so pipelines on plain K8s runners are never blocked;
# trigger on a docker-tagged amd64 runner. Mirrors the integration-test policy.
e2e-element-web:
  stage: integration
  tags:
    - docker
  image: docker:latest
  services:
    - name: docker:dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # amd64 native Dex — default timeouts are fine; raise here if a runner is slow.
    NEBU_E2E_NAV_TIMEOUT_MS: "60000"
  before_script:
    - apk add --no-cache make openssl
    - until docker info; do sleep 1; done
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - echo "$DOCKER_REGISTRY_PASS" | docker login "$DOCKER_REGISTRY" --username "$DOCKER_REGISTRY_USER" --password-stdin
  script:
    - make test-e2e-element-ci
  artifacts:
    when: always
    paths:
      - e2e/playwright-report/
      - e2e/test-results/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
# Daemonless alternative to integration-test for plain K8s runners (no DinD).
# Uses podman-compose instead of docker compose — no Docker daemon required.
# Requires the runner pod to have user namespaces enabled (/dev/fuse + SYS_ADMIN)
# or to run with privileged: true. If neither is available, the job will fail
# at `podman-compose up` with a "newuidmap" or "fuse" error.
integration-test-podman:
  stage: integration
  image: quay.io/podman/stable
  variables:
    COMPOSE_PROJECT_NAME: nebu
  before_script:
    - dnf install -y --quiet make openssl python3-pip
    - pip3 install --quiet podman-compose
    - podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - echo "$DOCKER_REGISTRY_PASS" | podman login "$DOCKER_REGISTRY" --username "$DOCKER_REGISTRY_USER" --password-stdin
    - make setup
  script:
    # go-removal-cleanup (full-elixir-stack): runs the Elixir integration suite against
    # the server (server:8008 Matrix, server:4000 admin) — the Go integration runner was removed.
    - podman-compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait
    - podman run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace --network=nebu_default -e NEBU_DB_URL=postgresql://nebu_app:nebu_app_dev_pw@postgres:5432/nebu -e NEBU_DB_URL_MIGRATE=postgresql://nebu_migrate:nebu_migrate_dev_pw@postgres:5432/nebu -e NEBU_TEST_MATRIX_URL=http://server:8008 -e NEBU_TEST_SERVER_URL=http://server:4000 -e NEBU_TEST_DEX_URL=http://dex:5556 elixir:1.19-alpine sh -c "cd server && mix local.hex --force && mix deps.get && mix test --include integration --warnings-as-errors"
  after_script:
    - podman-compose -f docker-compose.yml -f docker-compose.ci.yml down
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
# ─── Integration Test — K8s-native (GitLab CI services:) ──────────────────────
# Runs on plain K8s runners without DinD/Podman. Uses GitLab CI `services:` to
# start sidecar containers in the same pod — no Docker daemon, no privilege
# escalation needed.
#
# go-removal-cleanup (full-elixir-stack): the Go gateway sidecar and the Go
# integration runner were removed. The server now serves the public Matrix CS API
# directly (server:4000) and runs DB migrations on startup, so the test runner
# targets the server and executes the Elixir integration suite.
#
# Note: postgres init scripts (dev/postgres/init/) do NOT run in CI because
# there are no persistent volumes. We use the `nebu` superuser for all DB
# connections — the role split (nebu_migrate / nebu_app) is a production
# hardening, not required for CI testing.
#
# Credentials policy (ADR-012): all values below are example-only CI credentials.
# This upstream repo is never used for real deployments. Anyone deploying Nebu
# must fork and supply their own secrets. See ADR-012 and docs/architecture/adr/ADR-012.

integration-test-k8s:
  stage: integration
  image: $CI_REGISTRY_IMAGE/ci-elixir:1.19
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_DB: nebu
        POSTGRES_USER: nebu
        POSTGRES_HOST_AUTH_METHOD: trust
    - name: $CI_REGISTRY_IMAGE/ci-dex:v2.45.1
      alias: dex
    - name: $CI_REGISTRY_IMAGE/server:${CI_COMMIT_SHA}
      alias: server
  variables:
    NEBU_DB_URL: "postgresql://nebu@postgres:5432/nebu"
    NEBU_DB_URL_MIGRATE: "postgresql://nebu@postgres:5432/nebu"
    DATABASE_URL: "ecto://nebu@postgres:5432/nebu"
    NEBU_INTERNAL_SECRET_FILE: ""
    NEBU_INTERNAL_SECRET: "ci-example-secret"
    NEBU_SERVER_NAME: "localhost"
    NEBU_OIDC_ISSUER: "http://dex:5556/dex"
    NEBU_ADMIN_OIDC_CLIENT_ID: "nebu-admin"
    NEBU_ADMIN_OIDC_CLIENT_SECRET: "nebu-admin-secret"
  before_script:
    - apk add --no-cache postgresql-client openssl
    - scripts/wait-for-stack.sh
  script:
    - |
      cd server
      NEBU_DB_URL=postgresql://nebu@postgres:5432/nebu \
      NEBU_TEST_MATRIX_URL=http://server:8008 \
      NEBU_TEST_SERVER_URL=http://server:4000 \
      NEBU_TEST_DEX_URL=http://dex:5556 \
      mix deps.get && mix test --include integration --warnings-as-errors
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
# ─── IaC Validation ───────────────────────────────────────────────────────────
# Story 13-1 AC6: Validates OpenTofu formatting and syntax on every push that
# touches deploy/. No cloud credentials required — tofu validate checks HCL
# syntax and type correctness only, without connecting to any provider.
validate-iac:
  stage: verify
  image: ghcr.io/opentofu/opentofu:1.9
  cache:
    - key:
        files:
          - deploy/tofu/examples/aws/.terraform.lock.hcl
      paths:
        - deploy/tofu/examples/aws/.terraform/
    - key:
        files:
          - deploy/tofu/examples/stackit/.terraform.lock.hcl
      paths:
        - deploy/tofu/examples/stackit/.terraform/
    - key:
        files:
          - deploy/tofu/examples/k8s/.terraform.lock.hcl
      paths:
        - deploy/tofu/examples/k8s/.terraform/
    - key:
        files:
          - deploy/tofu/examples/upcloud/.terraform.lock.hcl
      paths:
        - deploy/tofu/examples/upcloud/.terraform/
  script:
    - echo "==> OpenTofu version"
    - tofu version
    - echo "==> Checking HCL formatting (tofu fmt -check -recursive)"
    - tofu fmt -check -recursive deploy/tofu/
    - echo "==> Validating deploy/tofu/examples/aws"
    - (cd deploy/tofu/examples/aws && tofu init -backend=false && tofu validate)
    - echo "==> Validating deploy/tofu/examples/stackit"
    - (cd deploy/tofu/examples/stackit && tofu init -backend=false && tofu validate)
    - echo "==> Validating deploy/tofu/examples/k8s"
    - (cd deploy/tofu/examples/k8s && tofu init -backend=false && tofu validate)
    - echo "==> Validating deploy/tofu/examples/upcloud"
    - (cd deploy/tofu/examples/upcloud && tofu init -backend=false && tofu validate)
    - echo "==> IaC validation passed."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - deploy/**/*
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
    - if: '$CI_COMMIT_BRANCH =~ /^bugfix\//'
      changes:
        - deploy/**/*
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - deploy/**/*
# Story 13-4a: Helm chart lint and template render check.
# Uses alpine/helm which ships only helm — separate job from validate-iac (different image).
# AC1: helm lint 0 warnings; AC2: helm template renders valid YAML.
validate-helm:
  stage: verify
  image: alpine/helm:3.17
  script:
    - echo "==> Helm version"
    - helm version
    - echo "==> Linting deploy/helm/nebu/"
    - helm lint deploy/helm/nebu/ --set server.image.tag=validate
    - echo "==> Template render check deploy/helm/nebu/"
    - helm template nebu deploy/helm/nebu/ --set server.image.tag=validate > /dev/null
    - echo "==> Helm validation passed."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - deploy/**/*
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
    - if: '$CI_COMMIT_BRANCH =~ /^bugfix\//'
      changes:
        - deploy/**/*
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - deploy/**/*
# ─── Release Image Builds ─────────────────────────────────────────────────────
# Triggered exclusively by SemVer Git tags (e.g. git tag v1.0.0 && git push origin v1.0.0).
# Produces the versioned image: <CI_REGISTRY_IMAGE>/nebu-server:<semver>.
# Referenced by operators via nebu_version in OpenTofu variables or server.image.tag in Helm.
#
# go-removal-cleanup (full-elixir-stack): release-gateway-image and release-media-image
# were removed — the server is the only release image now (serves Matrix, /_matrix/media, admin).
#
# --cache=false: avoid reusing branch-build Kaniko cache layers in release builds (deterministic, reproducible production images).
release-server-image:
  !!merge <<: *build_ci_image
  stage: release
  interruptible: false
  needs: [] # run independent of branch-only build/integration jobs
  script:
    - RELEASE_VERSION="${CI_COMMIT_TAG#v}" && /kaniko/executor --context "${CI_PROJECT_DIR}/server" --dockerfile server/Dockerfile --destination "${CI_REGISTRY_IMAGE}/nebu-server:${RELEASE_VERSION}" --build-arg "GIT_COMMIT=${CI_COMMIT_SHA}" --build-arg "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" --build-arg "RELEASE_VERSION=${RELEASE_VERSION}" --cache=false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
# ─── Renovate ─────────────────────────────────────────────────────────────────
# Runs dependency updates via Renovate on a weekly GitLab schedule.
# Setup:
#   1. Create a project access token with api + write_repository scope
#   2. Store it as CI variable RENOVATE_TOKEN (masked, not protected)
#   3. Add a scheduled pipeline: Settings → CI/CD → Schedules → weekly on main
#
# Renovate reads renovate.json from the repo root and opens MRs for updates.
.renovate:
  stage: .pre
  image: renovate/renovate:latest
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "${CI_SERVER_URL}/api/v4"
    RENOVATE_TOKEN: "${RENOVATE_TOKEN}"
    RENOVATE_REPOSITORIES: '["${CI_PROJECT_PATH}"]'
    LOG_LEVEL: info
  script:
    - renovate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
# ─── Release Tag Creation ──────────────────────────────────────────────────────
# Runs at the end of the release/* branch pipeline — after all lint, unit, scan,
# verify, build, and integration stages have passed successfully.
# Extracts the SemVer from the branch name (release/v1.2.3 → v1.2.3) and
# creates the corresponding Git tag via the GitLab API.
#
# Requires a CI variable GITLAB_TOKEN (project/group access token with
# write_repository scope, masked). Create one under Settings → Access Tokens.
# The token must have at least the Developer role to create tags.
#
# Idempotency: if the tag already exists the API returns 400 and the job fails —
# intentional, to prevent overwriting an existing release tag.
create-release-tag:
  stage: release
  image: alpine:latest
  interruptible: false
  variables:
    GIT_STRATEGY: none
    DEVGUARD_EXCLUDE_PATHS: "**/_bmad/**, **/_bmad_output/**, **/skills/**, **/node_modules/**, **/docs/**, **/test/**, **/deploy/**"
  before_script:
    - apk add --no-cache curl
  script:
    - VERSION=$(echo "$CI_COMMIT_BRANCH" | sed 's|release/||')
    - echo "Creating tag ${VERSION} pointing at ${CI_COMMIT_SHA}"
    - |
      curl --fail --silent --show-error \
        --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags?tag_name=${VERSION}&ref=${CI_COMMIT_SHA}"
    - echo "Tag ${VERSION} created."
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\/v\d+\.\d+\.\d+$/'
include:
  - remote: "https://gitlab.opencode.de/l3montree/devguard-ci-components/-/raw/v1.6.0/templates/full.yml"
    inputs:
      devguard_asset_name: "$DEVGUARD_ASSET_NAME"
      devguard_token: "$DEVGUARD_TOKEN"
      devguard_api_url: "$DEVGUARD_API_URL"
      devguard_web_ui: "https://devguard.opencode.de"
    rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
